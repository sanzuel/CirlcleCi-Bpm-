version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2025.05

    steps:
      - checkout

      - run:
          name: Build Android APK
          command: |
            chmod +x ./gradlew
            ./gradlew assembleDebug

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: songsetlist.apk

workflows:
  android-apk:
    jobs:
      - build
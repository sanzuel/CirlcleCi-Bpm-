version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2025.05

    steps:
      - checkout

      - run:
          name: Generate Gradle Wrapper
          command: |
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x gradlew

      - run:
          name: Build Release
          command: |
            ./gradlew assembleRelease --no-daemon

      - run:
          name: SHOW ALL BUILD OUTPUTS
          command: |
            echo "===================================="
            echo "ALL APK FILES"
            echo "===================================="
            find . -type f -name "*.apk" -print

            echo ""
            echo "===================================="
            echo "ALL OUTPUT DIRECTORIES"
            echo "===================================="
            find . -type d -path "*/build/outputs/*" -print

            echo ""
            echo "===================================="
            echo "APP BUILD DIRECTORY"
            echo "===================================="
            find app/build -maxdepth 5 -type f -print 2>/dev/null || true

      - run:
          name: Prepare APK
          command: |
            mkdir -p /tmp/apk

            find . -type f -name "*.apk" -exec cp {} /tmp/apk/ \;

            echo "Files prepared for CircleCI:"
            ls -lah /tmp/apk

      - store_artifacts:
          path: /tmp/apk
          destination: APK

workflows:
  build-release-apk:
    jobs:
      - build
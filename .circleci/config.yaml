version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2025.05

    steps:
      - checkout

      - run:
          name: Check Project
          command: |
            echo "Checking Android project..."
            ls -la
            find . -maxdepth 2 -type f | sort

      - run:
          name: Make Gradle Wrapper Executable
          command: |
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
            else
              echo "ERROR: gradlew was not found."
              echo "The Android Gradle Wrapper must be included in the repository."
              exit 1
            fi

      - run:
          name: Build Release APK
          command: |
            ./gradlew assembleRelease --no-daemon

      - run:
          name: Find APK
          command: |
            find . -type f -name "*.apk" -print

      - store_artifacts:
          path: app/build/outputs/apk/release
          destination: release-apk

workflows:
  build-release-apk:
    jobs:
      - build
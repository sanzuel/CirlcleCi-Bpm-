version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2025.05

    steps:
      - checkout

      - run:
          name: Check Android Project
          command: |
            echo "Project contents:"
            ls -la
            echo ""
            echo "App contents:"
            ls -la app || true

      - run:
          name: Generate Gradle Wrapper
          command: |
            gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin

            chmod +x gradlew

      - run:
          name: Build Release APK
          command: |
            ./gradlew assembleRelease --no-daemon

      - run:
          name: Locate APK
          command: |
            echo "Searching entire project for APK files..."
            find . -type f -name "*.apk" -print

            echo ""
            echo "Release output directory:"
            find app/build/outputs -type f -print 2>/dev/null || true

      - run:
          name: Prepare APK Artifact
          command: |
            mkdir -p /tmp/apk-artifact

            APK=$(find . -type f -name "*.apk" | head -n 1)

            if [ -z "$APK" ]; then
              echo "ERROR: No APK was generated."
              exit 1
            fi

            echo "Found APK:"
            echo "$APK"

            cp "$APK" /tmp/apk-artifact/app-release.apk

            echo "Artifact prepared:"
            ls -lh /tmp/apk-artifact/

      - store_artifacts:
          path: /tmp/apk-artifact
          destination: release-apk

workflows:
  build-release-apk:
    jobs:
      - build
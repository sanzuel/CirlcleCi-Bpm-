version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2025.05

    steps:
      - checkout

      - run:
          name: Check Android Project
          command: |
            echo "Project files:"
            ls -la
            echo ""
            echo "App folder:"
            ls -la app || true
            echo ""
            echo "Gradle files:"
            ls -la build.gradle settings.gradle gradle.properties 2>/dev/null || true

      - run:
          name: Generate Gradle Wrapper
          command: |
            echo "Generating Gradle Wrapper..."

            gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin

            chmod +x gradlew

            echo ""
            echo "Gradle Wrapper generated:"
            ls -la gradlew
            ls -la gradlew.bat
            ls -la gradle/wrapper/

      - run:
          name: Verify Gradle Wrapper
          command: |
            ./gradlew --version

      - run:
          name: Build Release APK
          command: |
            ./gradlew assembleRelease --no-daemon

      - run:
          name: Find Release APK
          command: |
            echo "Searching for APK..."
            find app/build/outputs -type f -name "*.apk" -print

      - store_artifacts:
          path: app/build/outputs/apk/release
          destination: release-apk

      - store_artifacts:
          path: gradle/wrapper
          destination: generated-gradle-wrapper

workflows:
  build-release-apk:
    jobs:
      - build